<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Çeşme</title>
<meta name="description" content="Alınacaklar ve götürülecekler listesi">
<meta name="theme-color" content="#ffffff">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="favicon.ico" sizes="48x48">
<link rel="icon" type="image/png" sizes="64x64" href="favicon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Çeşme">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#ffffff;
  --ink:#040317;
  --muted:#9a9cb0;
  --card:#f5f6f9;
  --line:#eef0f4;
  --accent:#1F18C0;
  --accent-soft:#A5A1EC;
  --danger:#ff5c69;
  --sans:'Figtree',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg)}
body{
  font-family:var(--sans);color:var(--ink);
  min-height:100vh;min-height:100dvh;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  -webkit-font-smoothing:antialiased;
  overscroll-behavior-y:none;
}
.app{max-width:560px;margin:0 auto;padding:12px 16px 120px}

/* ---- top bar ---- */
.topbar{position:relative;display:flex;align-items:center;justify-content:space-between;
  min-height:56px;margin-bottom:8px}
.topbar .titles{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);
  text-align:center;pointer-events:none}
.topbar h1{font-size:27px;font-weight:700;line-height:1.2;color:var(--ink);
  letter-spacing:.04em}
.tb-btn{position:relative;z-index:1;font-family:var(--sans);background:transparent;border:none;
  color:var(--accent);min-width:48px;min-height:48px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;border-radius:12px}
.tb-btn:active{opacity:.6}
.tb-spacer{min-width:48px}
button:focus-visible,input:focus-visible,.add-row:focus-visible{
  outline:3px solid var(--accent);outline-offset:2px}

/* ---- flat outlined tabs ---- */
.segments{display:flex;gap:10px}
.segment{flex:1;border:2px solid var(--line);background:var(--bg);border-radius:16px;
  padding:12px 6px;font-family:var(--sans);font-size:18px;font-weight:600;
  color:var(--muted);cursor:pointer;display:flex;align-items:center;justify-content:center;
  gap:6px;min-height:60px;transition:border-color .15s ease,color .15s ease}
.segment svg{flex-shrink:0}
.segment[aria-selected="true"]{border-color:var(--accent);color:var(--accent)}
.segment:active{background:var(--card)}

/* ---- panel slide animation ---- */
#panel.anim-left{animation:slideL .22s ease}
#panel.anim-right{animation:slideR .22s ease}
@keyframes slideL{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}
@keyframes slideR{from{opacity:0;transform:translateX(-24px)}to{opacity:1;transform:none}}

/* ---- inline add row ---- */
.add-row{display:flex;align-items:center;min-height:62px;border-bottom:1px solid var(--line);
  color:var(--muted);font-size:21px;font-weight:500;cursor:text;margin-top:10px}
.add-row input{flex:1;border:none;outline:none;background:transparent;font-family:var(--sans);
  font-size:21px;font-weight:500;color:var(--ink);padding:0;min-width:0}
.add-row input::placeholder{color:var(--muted)}

/* ---- task rows ---- */
ul.tasks{list-style:none}
li.item{display:flex;align-items:center;gap:10px;min-height:64px;
  border-bottom:1px solid var(--line);animation:fadeIn .25s ease;cursor:pointer}
li.item:active{background:var(--card)}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

.check{flex-shrink:0;width:48px;height:48px;margin-left:-10px;border:none;background:none;
  display:flex;align-items:center;justify-content:center}
.check .ring{width:31px;height:31px;border-radius:50%;border:2px solid #d9dbe6;
  background:var(--bg);display:flex;align-items:center;justify-content:center;
  transition:background .15s ease,border-color .15s ease}
li.item.checked .ring,li.item.leaving .ring{background:var(--accent);border-color:var(--accent)}
.ring svg{opacity:0;transform:scale(.5);transition:opacity .15s ease,transform .15s ease}
li.item.checked .ring svg,li.item.leaving .ring svg{opacity:1;transform:scale(1)}

.label{flex:1;font-size:21px;font-weight:500;line-height:1.35;padding:16px 0;
  min-width:0;overflow-wrap:anywhere}
.label input{width:100%;border:none;outline:none;background:transparent;
  font-family:var(--sans);font-size:21px;font-weight:500;color:var(--ink)}
li.item.checked .label{color:var(--muted)}
li.item.checked .label .t-label{text-decoration:line-through;
  text-decoration-thickness:1.5px;text-decoration-color:var(--muted)}
li.item.leaving{opacity:0;transform:translateX(30px);
  transition:opacity .4s ease .25s,transform .4s ease .25s}

.more{flex-shrink:0;width:48px;height:48px;margin-right:-10px;border:none;background:none;
  color:#b9bcd0;cursor:pointer;border-radius:50%;
  display:flex;align-items:center;justify-content:center}
.more:active{color:var(--accent)}

.done-header{font-size:16px;font-weight:600;color:var(--muted);
  padding:22px 0 10px;border-bottom:1px solid var(--line);list-style:none}

/* ---- empty state: line illustration, vertically centered ---- */
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:16px;min-height:52vh}
.empty[hidden]{display:none}
.empty p{font-size:17px;font-weight:600;color:var(--muted)}
.empty p[hidden]{display:none}

/* ---- toast: flat, full content width ---- */
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));
  transform:translate(-50%,16px);width:calc(100% - 32px);max-width:528px;
  background:var(--accent);color:#fff;font-size:18px;font-weight:600;
  padding:18px 22px;border-radius:18px;opacity:0;pointer-events:none;
  transition:opacity .15s ease,transform .15s ease;text-align:center;z-index:50;
  line-height:1.4}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* ---- confirm dialog: flat ---- */
.overlay{position:fixed;inset:0;background:rgba(4,3,23,.34);display:none;
  align-items:center;justify-content:center;padding:24px;z-index:100}
.overlay.show{display:flex}
.alert{background:var(--bg);border-radius:22px;max-width:340px;width:100%;overflow:hidden;
  border:1.5px solid var(--line);animation:pop .2s ease}
@keyframes pop{from{transform:scale(.92);opacity:0}to{transform:scale(1);opacity:1}}
.alert-body{padding:26px 22px 20px;text-align:center}
.alert-body .a-icon{color:var(--accent);margin-bottom:10px}
.alert-body h2{font-size:21px;font-weight:700;margin-bottom:8px}
.alert-body p{font-size:19px;font-weight:500;color:var(--muted);line-height:1.45}
.alert-actions{display:flex;border-top:1px solid var(--line)}
.alert-actions button{flex:1;font-family:var(--sans);font-size:19px;padding:18px 8px;
  border:none;background:none;cursor:pointer;min-height:60px}
.alert-actions button:first-child{border-right:1px solid var(--line);
  font-weight:500;color:var(--muted)}
.alert-actions button:last-child{color:var(--accent);font-weight:700}
.alert-actions button:active{background:var(--card)}

/* ---- item action sheet: flat ---- */
.sheet-scrim{position:fixed;inset:0;background:rgba(4,3,23,.34);z-index:90;
  opacity:0;pointer-events:none;transition:opacity .25s ease}
.sheet-scrim.show{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:95;
  padding:0 12px calc(12px + env(safe-area-inset-bottom));
  transform:translateY(110%);transition:transform .3s cubic-bezier(.32,.72,.28,1);
  max-width:560px;margin:0 auto}
.sheet.show{transform:translateY(0)}
.sheet-group{background:var(--bg);border-radius:18px;overflow:hidden;
  border:1.5px solid var(--line)}
.sheet-name{font-size:16px;font-weight:600;color:var(--muted);text-align:center;
  padding:16px 20px 14px;border-bottom:1px solid var(--line);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sheet-group button{display:flex;align-items:center;justify-content:center;gap:10px;
  width:100%;font-family:var(--sans);font-size:20px;
  font-weight:500;color:var(--ink);background:none;border:none;cursor:pointer;
  min-height:62px;border-bottom:1px solid var(--line)}
.sheet-group button svg{color:var(--accent)}
.sheet-group button span{display:inline-flex;align-items:center}
.sheet-group button:last-child{border-bottom:none}
.sheet-group button:active{background:var(--card)}
.sheet-group button.danger{color:var(--danger)}
.sheet-group button.danger svg{color:var(--danger)}
.sheet-cancel{margin-top:10px}
.sheet-cancel button{display:block;width:100%;font-family:var(--sans);font-size:20px;
  font-weight:700;color:var(--accent);background:var(--bg);border:1.5px solid var(--line);
  cursor:pointer;min-height:62px;border-radius:18px}
.sheet-cancel button:active{background:var(--card)}

/* ---- celebration: fish + waves ---- */
#celebrate{position:fixed;inset:0;background:var(--bg);z-index:200;display:none;
  overflow:hidden;opacity:1;transition:opacity .5s ease}
#celebrate.show{display:block}
#celebrate.fade{opacity:0}
#celebrate .msg{position:absolute;left:0;right:0;top:34%;text-align:center;
  font-size:28px;font-weight:700;color:var(--ink);letter-spacing:.03em;
  padding:0 24px;animation:msgIn .5s ease}
@keyframes msgIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.swim{position:absolute;left:0;color:var(--accent);
  animation:swim 2.6s cubic-bezier(.35,0,.55,1) forwards}
.swim.light{color:var(--accent-soft)}
@keyframes swim{from{transform:translateX(112vw)}to{transform:translateX(-18vw)}}
.swim .bob{display:block;animation:bob 1s ease-in-out infinite alternate}
@keyframes bob{from{transform:translateY(-7px)}to{transform:translateY(7px)}}
.waveband{position:absolute;left:0;bottom:0;width:200%;
  animation:waveslide 3s linear infinite}
@keyframes waveslide{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.waveband svg{display:block;width:100%;height:70px}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="tb-spacer"></div>
    <div class="titles">
      <h1>Çeşme</h1>
    </div>
    <button class="tb-btn" id="clearBtn" aria-label="Yolculuğu tamamla ve listeleri temizle">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="5" r="2.6"/>
        <path d="M12 7.6V21"/>
        <path d="M5 12H2a10 10 0 0 0 20 0h-3"/>
      </svg>
    </button>
  </div>

  <div class="segments" role="tablist" aria-label="Listeler">
    <button class="segment" role="tab" id="tab-buy" aria-selected="true" aria-controls="panel">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M2.5 12c2.8-4.4 6.6-6.6 10-5.2 2.5 1 4.4 3 5.8 5.2-1.4 2.2-3.3 4.2-5.8 5.2-3.4 1.4-7.2-.8-10-5.2z"/>
        <path d="M18.3 12l3.2-3.6v7.2z"/>
        <circle cx="7.6" cy="10.9" r=".6" fill="currentColor" stroke="none"/>
      </svg>
      Alınacaklar
    </button>
    <button class="segment" role="tab" id="tab-bring" aria-selected="false" aria-controls="panel">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M12 3v13"/>
        <path d="M12 4.5L18 14h-6z"/>
        <path d="M12 7.5L7.5 14H12"/>
        <path d="M4 17h16l-1.8 3.5H5.8z"/>
      </svg>
      Götürülecekler
    </button>
  </div>

  <div id="panel" role="tabpanel" aria-live="polite">
    <div class="add-row" id="addRow" role="button" tabindex="0" aria-label="Yeni madde ekle">
      <span class="add-ph">＋ Ne lazım</span>
    </div>
    <ul class="tasks" id="list"></ul>
    <div class="empty" id="empty" hidden>
      <svg width="110" height="80" viewBox="0 0 110 80" fill="none" stroke="#1F18C0" stroke-width="2.5" stroke-linecap="round" aria-hidden="true">
        <circle cx="55" cy="26" r="14"/>
        <path d="M10 58c6-6 12-6 18 0s12 6 18 0 12-6 18 0 12 6 18 0 12-6 18 0" opacity=".9"/>
        <path d="M10 70c6-6 12-6 18 0s12 6 18 0 12-6 18 0 12 6 18 0 12-6 18 0" opacity=".4"/>
      </svg>
      <p id="emptyText" hidden></p>
    </div>
  </div>
</div>

<div class="toast" id="toast" role="status"></div>

<div class="overlay" id="overlay" role="alertdialog" aria-modal="true" aria-labelledby="alertTitle" aria-describedby="alertDesc">
  <div class="alert">
    <div class="alert-body">
      <div class="a-icon">
        <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="5" r="2.6"/>
          <path d="M12 7.6V21"/>
          <path d="M5 12H2a10 10 0 0 0 20 0h-3"/>
        </svg>
      </div>
      <h2 id="alertTitle">Çeşme yolcusu kalmasın</h2>
      <p id="alertDesc">İki listeyi de siliyorum</p>
    </div>
    <div class="alert-actions">
      <button id="cancelClear">Vazgeç</button>
      <button id="confirmClear">Sil gitsin</button>
    </div>
  </div>
</div>

<div class="sheet-scrim" id="sheetScrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Madde işlemleri">
  <div class="sheet-group">
    <div class="sheet-name" id="sheetName"></div>
    <button id="actEdit">Düzelt</button>
    <button id="actMove"><span id="actMoveIcon"></span><span id="actMoveText"></span></button>
    <button id="actDelete" class="danger">Sil gitsin</button>
  </div>
  <div class="sheet-cancel"><button id="actCancel">Vazgeç</button></div>
</div>

<div id="celebrate" aria-hidden="true">
  <div class="msg" id="celebrateMsg"></div>
  <div class="waveband" style="bottom:0">
    <svg viewBox="0 0 1200 70" preserveAspectRatio="none" fill="none" stroke="#1F18C0" stroke-width="3" stroke-linecap="round">
      <path d="M0 35q37.5-28 75 0t75 0t75 0t75 0t75 0t75 0t75 0t75 0t75 0t75 0t75 0t75 0t75 0t75 0t75 0t75 0"/>
    </svg>
  </div>
  <div class="waveband" style="bottom:26px;animation-duration:4.2s;opacity:.35">
    <svg viewBox="0 0 1200 70" preserveAspectRatio="none" fill="none" stroke="#1F18C0" stroke-width="3" stroke-linecap="round">
      <path d="M0 35q37.5-28 75 0t75 0t75 0t75 0t75 0t75 0t75 0t75 0t75 0t75 0t75 0t75 0t75 0t75 0t75 0t75 0"/>
    </svg>
  </div>
</div>

<script>
(function () {
  var STORAGE_KEY = 'yazlik-listesi-v1';
  var state = { buy: [], bring: [], tab: 'buy' };

  try {
    var saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
    if (saved && Array.isArray(saved.buy) && Array.isArray(saved.bring)) {
      state.buy = saved.buy;
      state.bring = saved.bring;
    }
  } catch (e) {}

  var listEl = document.getElementById('list');
  var emptyEl = document.getElementById('empty');
  var emptyText = document.getElementById('emptyText');
  var addRow = document.getElementById('addRow');
  var panel = document.getElementById('panel');
  var tabBuy = document.getElementById('tab-buy');
  var tabBring = document.getElementById('tab-bring');
  var toastEl = document.getElementById('toast');
  var overlay = document.getElementById('overlay');
  var sheet = document.getElementById('sheet');
  var sheetScrim = document.getElementById('sheetScrim');
  var celebrateEl = document.getElementById('celebrate');
  var toastTimer = null;
  var sheetItem = null;

  var FISH = '<svg width="__S__" height="__S__" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 12c2.8-4.4 6.6-6.6 10-5.2 2.5 1 4.4 3 5.8 5.2-1.4 2.2-3.3 4.2-5.8 5.2-3.4 1.4-7.2-.8-10-5.2z"/><path d="M18.3 12l3.2-3.6v7.2z"/><circle cx="7.6" cy="10.9" r=".6" fill="currentColor" stroke="none"/></svg>';

  function save() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify({ buy: state.buy, bring: state.bring })); } catch (e) {}
  }

  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }

  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.classList.remove('show'); }, 2400);
  }

  function checkSvg() {
    return '<span class="ring"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">' +
      '<path d="M3 8.5l3.2 3.2L13 5" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></span>';
  }

  function makeItem(item, listName) {
    var li = document.createElement('li');
    li.className = 'item' + (item.checked ? ' checked' : '');
    li.dataset.id = item.id;

    var check = document.createElement('span');
    check.className = 'check';
    check.setAttribute('aria-hidden', 'true');
    check.innerHTML = checkSvg();

    var label = document.createElement('span');
    label.className = 'label';
    var inner = document.createElement('span');
    inner.className = 't-label';
    inner.textContent = item.text;
    label.appendChild(inner);

    var more = document.createElement('button');
    more.className = 'more';
    more.setAttribute('aria-label', 'Seçenekler: ' + item.text);
    more.innerHTML = '<svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="2.1"/><circle cx="12" cy="12" r="2.1"/><circle cx="19" cy="12" r="2.1"/></svg>';
    more.addEventListener('click', function (e) {
      e.stopPropagation();
      openSheet(listName, item.id);
    });

    li.setAttribute('role', 'button');
    li.setAttribute('tabindex', '0');
    li.setAttribute('aria-pressed', item.checked ? 'true' : 'false');
    li.setAttribute('aria-label', (item.checked ? 'İşareti kaldır: ' : 'İşaretle: ') + item.text);
    li.addEventListener('click', function (e) {
      if (e.target.closest('.more') || e.target.tagName === 'INPUT') return;
      onCheck(listName, item.id, li);
    });
    li.addEventListener('keydown', function (e) {
      if ((e.key === 'Enter' || e.key === ' ') && e.target === li) {
        e.preventDefault();
        onCheck(listName, item.id, li);
      }
    });

    li.appendChild(check);
    li.appendChild(label);
    li.appendChild(more);
    return li;
  }

  function render() {
    tabBuy.setAttribute('aria-selected', state.tab === 'buy' ? 'true' : 'false');
    tabBring.setAttribute('aria-selected', state.tab === 'bring' ? 'true' : 'false');

    listEl.innerHTML = '';
    var items = state[state.tab];

    if (state.tab === 'buy') {
      items.forEach(function (item) { listEl.appendChild(makeItem(item, 'buy')); });
    } else {
      var open = items.filter(function (i) { return !i.checked; });
      var done = items.filter(function (i) { return i.checked; });
      open.forEach(function (item) { listEl.appendChild(makeItem(item, 'bring')); });
      if (done.length) {
        var head = document.createElement('li');
        head.className = 'done-header';
        head.textContent = 'Çantaya attım';
        listEl.appendChild(head);
        done.forEach(function (item) { listEl.appendChild(makeItem(item, 'bring')); });
      }
    }

    var isEmpty = items.length === 0;
    listEl.hidden = isEmpty;
    emptyEl.hidden = !isEmpty;
    if (state.tab === 'buy') {
      emptyText.textContent = 'Her şey alınmış!';
      emptyText.hidden = false;
    } else {
      emptyText.hidden = true;
    }
  }

  function switchTab(tab, direction) {
    if (state.tab === tab) return;
    state.tab = tab;
    render();
    panel.classList.remove('anim-left', 'anim-right');
    void panel.offsetWidth; /* restart animation */
    panel.classList.add(direction === 'left' ? 'anim-left' : 'anim-right');
  }

  function onCheck(listName, id, li) {
    if (listName === 'buy') {
      var idx = state.buy.findIndex(function (i) { return i.id === id; });
      if (idx === -1) return;
      var item = state.buy[idx];
      li.classList.add('leaving');
      setTimeout(function () {
        state.buy.splice(idx, 1);
        state.bring.push({ id: item.id, text: item.text, checked: false });
        save();
        render();
        toast('Götürülecekler listesine geçti');
      }, 650);
    } else {
      var it = state.bring.find(function (i) { return i.id === id; });
      if (!it) return;
      it.checked = !it.checked;
      save();
      render();
    }
  }

  /* ---- horizontal swipe anywhere switches lists ---- */
  var tg = null;
  document.addEventListener('touchstart', function (e) {
    if (overlay.classList.contains('show') || sheet.classList.contains('show') ||
        celebrateEl.classList.contains('show') || e.target.closest('input')) { tg = null; return; }
    tg = { x: e.touches[0].clientX, y: e.touches[0].clientY, decided: false, horiz: false };
  }, { passive: true });
  document.addEventListener('touchmove', function (e) {
    if (!tg) return;
    var dx = e.touches[0].clientX - tg.x, dy = e.touches[0].clientY - tg.y;
    if (!tg.decided && (Math.abs(dx) > 10 || Math.abs(dy) > 10)) {
      tg.decided = true;
      tg.horiz = Math.abs(dx) > Math.abs(dy) * 1.2;
    }
    if (tg.decided && tg.horiz) e.preventDefault();
  }, { passive: false });
  document.addEventListener('touchend', function (e) {
    if (!tg || !tg.decided || !tg.horiz) { tg = null; return; }
    var dx = e.changedTouches[0].clientX - tg.x;
    if (dx < -60) switchTab('bring', 'left');
    else if (dx > 60) switchTab('buy', 'right');
    tg = null;
  });

  /* ---- action sheet ---- */
  var FISH_SMALL = FISH.replace(/__S__/g, '22');
  var BOAT_SMALL = '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v13"/><path d="M12 4.5L18 14h-6z"/><path d="M12 7.5L7.5 14H12"/><path d="M4 17h16l-1.8 3.5H5.8z"/></svg>';

  function openSheet(listName, id) {
    var item = state[listName].find(function (i) { return i.id === id; });
    if (!item) return;
    sheetItem = { listName: listName, id: id };
    document.getElementById('sheetName').textContent = item.text;
    document.getElementById('actMoveIcon').innerHTML = listName === 'buy' ? BOAT_SMALL : FISH_SMALL;
    document.getElementById('actMoveText').textContent =
      listName === 'buy' ? 'Götürülecekler listesine taşı' : 'Alınacaklar listesine taşı';
    sheet.classList.add('show');
    sheetScrim.classList.add('show');
  }
  function closeSheet() {
    sheet.classList.remove('show');
    sheetScrim.classList.remove('show');
  }
  sheetScrim.addEventListener('click', closeSheet);
  document.getElementById('actCancel').addEventListener('click', closeSheet);

  document.getElementById('actDelete').addEventListener('click', function () {
    if (!sheetItem) return;
    state[sheetItem.listName] = state[sheetItem.listName].filter(function (i) { return i.id !== sheetItem.id; });
    save();
    render();
    closeSheet();
  });

  document.getElementById('actMove').addEventListener('click', function () {
    if (!sheetItem) return;
    var from = sheetItem.listName;
    var to = from === 'buy' ? 'bring' : 'buy';
    var idx = state[from].findIndex(function (i) { return i.id === sheetItem.id; });
    if (idx === -1) return;
    var item = state[from].splice(idx, 1)[0];
    item.checked = false;
    state[to].push(item);
    save();
    render();
    closeSheet();
    toast(to === 'bring' ? 'Götürülecekler listesine taşındı' : 'Alınacaklar listesine taşındı');
  });

  document.getElementById('actEdit').addEventListener('click', function () {
    if (!sheetItem) return;
    var info = sheetItem;
    closeSheet();
    var item = state[info.listName].find(function (i) { return i.id === info.id; });
    if (!item) return;
    if (state.tab !== info.listName) { state.tab = info.listName; render(); }
    var li = listEl.querySelector('li[data-id="' + info.id + '"]');
    if (!li) return;
    var label = li.querySelector('.label');
    label.innerHTML = '<input type="text" enterkeyhint="done" maxlength="120" aria-label="Maddeyi düzenle">';
    var inp = label.querySelector('input');
    inp.value = item.text;
    inp.focus();
    inp.setSelectionRange(inp.value.length, inp.value.length);
    var commit = function () {
      var v = inp.value.trim();
      if (v) item.text = v;
      save();
      render();
    };
    inp.addEventListener('keydown', function (ev) { if (ev.key === 'Enter') inp.blur(); });
    inp.addEventListener('blur', commit);
  });

  /* ---- inline add row ---- */
  function openAdd() {
    if (addRow.querySelector('input')) return;
    addRow.innerHTML = '<input type="text" enterkeyhint="done" autocapitalize="sentences" maxlength="120" aria-label="Yeni madde">';
    var inp = addRow.querySelector('input');
    inp.focus();
    var commit = function () {
      var v = inp.value.trim();
      if (v) {
        state[state.tab].push({ id: uid(), text: v, checked: false });
        save();
        render();
      }
      addRow.innerHTML = '<span class="add-ph">＋ Ne lazım</span>';
    };
    inp.addEventListener('keydown', function (ev) { if (ev.key === 'Enter') inp.blur(); });
    inp.addEventListener('blur', commit);
  }
  addRow.addEventListener('click', openAdd);
  addRow.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openAdd(); }
  });

  tabBuy.addEventListener('click', function () { switchTab('buy', 'right'); });
  tabBring.addEventListener('click', function () { switchTab('bring', 'left'); });

  /* ---- anchor: finish the trip ---- */
  document.getElementById('clearBtn').addEventListener('click', function () {
    overlay.classList.add('show');
    document.getElementById('cancelClear').focus();
  });
  document.getElementById('cancelClear').addEventListener('click', function () {
    overlay.classList.remove('show');
  });
  document.getElementById('confirmClear').addEventListener('click', function () {
    state.buy = [];
    state.bring = [];
    save();
    render();
    overlay.classList.remove('show');
    celebrate();
  });
  overlay.addEventListener('click', function (e) {
    if (e.target === overlay) overlay.classList.remove('show');
  });

  var CELEBRATE_MSGS = ['Hoşgeldin Şuşu!', 'Çünkü taşındık', 'Haydi hop denize', 'Ondan sonra haçan ben duymadum'];
  function celebrate() {
    var msg = CELEBRATE_MSGS[Math.floor(Math.random() * CELEBRATE_MSGS.length)];
    var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (reduced) { toast(msg); return; }
    document.getElementById('celebrateMsg').textContent = msg;
    // spawn fish
    var fishes = [
      { top: '18%', size: 54, delay: 0,    light: false, dur: 2.6 },
      { top: '52%', size: 42, delay: 0.25, light: true,  dur: 3.0 },
      { top: '64%', size: 64, delay: 0.1,  light: false, dur: 2.4 },
      { top: '28%', size: 36, delay: 0.45, light: true,  dur: 3.2 },
      { top: '76%', size: 46, delay: 0.3,  light: false, dur: 2.8 }
    ];
    fishes.forEach(function (f) {
      var el = document.createElement('span');
      el.className = 'swim' + (f.light ? ' light' : '');
      el.style.top = f.top;
      el.style.animationDelay = f.delay + 's';
      el.style.animationDuration = f.dur + 's';
      el.innerHTML = '<span class="bob">' + FISH.replace(/__S__/g, String(f.size)) + '</span>';
      celebrateEl.appendChild(el);
    });
    celebrateEl.classList.add('show');
    setTimeout(function () { celebrateEl.classList.add('fade'); }, 3200);
    setTimeout(function () {
      celebrateEl.classList.remove('show', 'fade');
      celebrateEl.querySelectorAll('.swim').forEach(function (el) { el.remove(); });
    }, 3800);
  }

  render();

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js').catch(function () {});
    });
  }
})();
</script>
</body>
</html>
